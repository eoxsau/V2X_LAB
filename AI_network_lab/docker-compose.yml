services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_network_lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_network_lab
      POSTGRES_PASSWORD: ai_network_lab
      POSTGRES_DB: ai_network_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_network_lab -d ai_network_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
