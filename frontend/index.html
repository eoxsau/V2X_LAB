<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V2X AI Routing Lab — 자율주행 통신 경로 시뮬레이터</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Nanum Gothic (Korean) + Nanum Gothic Coding (mono/code) + Noto Sans (broad multilingual fallback for scripts Nanum Gothic doesn't cover) -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Prism.js — code-mode syntax highlighting (Scenario Assistant) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

  <link rel="stylesheet" href="styles.css?v=20260718a" />
  <style>
    :root { --sans: 'Nanum Gothic', 'Noto Sans', system-ui, sans-serif; }
    @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade { opacity: 1; }

    /* Math expression sub/sup — prevent line-height blowout */
    sub, sup { line-height: 0; font-size: 0.72em; }

    /* Prism JSON token colors — matched to app CSS variables, not a stock theme */
    .sc-code-layer .token.property  { color: var(--brand-2); }
    .sc-code-layer .token.string    { color: var(--good); }
    .sc-code-layer .token.boolean   { color: var(--warn); }
    .sc-code-layer .token.number    { color: var(--warn); }
    .sc-code-layer .token.null      { color: var(--ink-4); }
    .sc-code-layer .token.punctuation { color: var(--ink-3); }
    .sc-code-layer .token.operator  { color: var(--ink-3); }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="ui.jsx?v=20260623a"></script>
  <script type="text/babel" src="landing.jsx?v=20260728a"></script>
  <script type="text/babel" src="charts.jsx?v=20260706a"></script>
  <!-- ⚠️ 이 ?v= 는 브라우저 캐시를 깨는 유일한 장치다. jsx를 고쳤으면 **반드시** 해당 줄의
       값을 올릴 것 — 안 올리면 서버는 새 파일을 주는데 브라우저는 캐시된 옛 파일을 계속
       실행한다(2026-08-11 확인: 수정 후에도 옛 코드가 돌고 있었다). -->
  <!-- ⚠️ 파일 내용을 고쳤으면 이 ?v= 표시도 **반드시** 함께 올릴 것. 안 올리면 브라우저가
       "같은 주소니까 같은 파일"로 보고 캐시에 있는 옛날 코드를 계속 쓴다. 2026-08-12에
       실제로 겪었다 — 백엔드만 새 코드고 화면은 며칠 전 코드라, 없앤 줄 알았던 배치 실행이
       계속 돌아 원인 찾는 데 한참 걸렸다. -->
  <script type="text/babel" src="tab-dashboard.jsx?v=20260813a"></script>
  <script type="text/babel" src="tab-simulation.jsx?v=20260814c"></script>
  <script type="text/babel" src="tab-scenario.jsx?v=20260812a"></script>
  <script type="text/babel" src="tab-sim-chat.jsx?v=20260624a"></script>
  <script type="text/babel" src="tab-report.jsx?v=20260813a"></script>
  <script type="text/babel" src="tab-settings.jsx?v=20260811a"></script>
  <script type="text/babel" src="app.jsx?v=20260812a"></script>
</body>
</html>
